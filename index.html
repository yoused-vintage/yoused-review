<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>yoused - Share Your Experience</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px 16px 40px;
      line-height: 1.5;
      -webkit-tap-highlight-color: transparent;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.15rem;
      margin-bottom: 4px;
      color: #ffffff;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #9a9a9a;
      margin-bottom: 22px;
    }
    .section-label {
      font-size: 0.8rem;
      color: #9a9a9a;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-bottom: 10px;
    }
    /* 縦並びのチェックリスト形式（英文の一文が読みやすいように） */
    .option-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 22px;
    }
    .option-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 52px; /* Appleのタップ推奨サイズ(44pt)以上を確保 */
      background-color: #1e1e1e;
      color: #ffffff;
      border: 1px solid #3a3a3a;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 0.95rem;
      text-align: left;
      cursor: pointer;
      box-sizing: border-box;
    }
    .option-btn.active {
      background-color: #2a3a2f;
      border-color: #6fcf97;
    }
    .checkmark {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1.5px solid #666666;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: transparent;
    }
    .option-btn.active .checkmark {
      background-color: #6fcf97;
      border-color: #6fcf97;
      color: #121212;
    }
    .textarea-wrapper {
      margin-bottom: 20px;
    }
    textarea {
      width: 100%;
      height: 140px;
      background-color: #1e1e1e;
      color: #ffffff;
      border: 1px solid #333333;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px; /* iOSでフォーカス時に自動ズームさせないため16px以上に */
      box-sizing: border-box;
      resize: none;
      outline: none;
    }
    textarea:focus {
      border-color: #6fcf97;
    }
    textarea::placeholder {
      color: #777777;
    }
    .submit-btn {
      width: 100%;
      min-height: 52px;
      background-color: #d93025;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .submit-btn:active {
      opacity: 0.85;
    }
    .note {
      font-size: 0.78rem;
      color: #999999;
      text-align: center;
      margin-top: 12px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Thank you for visiting yoused</h1>
  <p class="subtitle">We'd love it if you could share your experience on Google.</p>

  <p class="section-label">Tap anything that matches your experience</p>
  <div class="option-list">
    <button class="option-btn" data-text="The staff were incredibly friendly and helpful.">
      <span class="checkmark">✓</span>
      <span>The staff were incredibly friendly and helpful.</span>
    </button>
    <button class="option-btn" data-text="Everything felt high quality, with amazing attention to detail.">
      <span class="checkmark">✓</span>
      <span>Everything felt high quality, with amazing attention to detail.</span>
    </button>
    <button class="option-btn" data-text="Such a unique concept, giving vintage pieces a whole new life.">
      <span class="checkmark">✓</span>
      <span>Such a unique concept, giving vintage pieces a whole new life.</span>
    </button>
    <button class="option-btn" data-text="Great selection, it felt like real treasure hunting.">
      <span class="checkmark">✓</span>
      <span>Great selection, it felt like real treasure hunting.</span>
    </button>
    <button class="option-btn" data-text="Genuinely one-of-a-kind pieces you won't find anywhere else.">
      <span class="checkmark">✓</span>
      <span>Genuinely one-of-a-kind pieces you won't find anywhere else.</span>
    </button>
    <button class="option-btn" data-text="I'd definitely come back again.">
      <span class="checkmark">✓</span>
      <span>I'd definitely come back again.</span>
    </button>
  </div>

  <p class="section-label">Your review</p>
  <div class="textarea-wrapper">
    <textarea id="reviewText" placeholder="Tap an option above, or write your own..."></textarea>
  </div>

  <button class="submit-btn" onclick="copyAndRedirect()">Copy &amp; Continue to Google</button>
  <p class="note">This copies your text and opens the Google review page, where you can paste it in and post.</p>
</div>

<script>
  const optionButtons = document.querySelectorAll('.option-btn');
  const reviewTextarea = document.getElementById('reviewText');

  optionButtons.forEach(button => {
    button.addEventListener('click', () => {
      const text = button.getAttribute('data-text');
      const isActive = button.classList.contains('active');

      if (isActive) {
        // Deselect: remove only this phrase, keep any manual edits intact
        button.classList.remove('active');
        reviewTextarea.value = reviewTextarea.value
          .replace(text, '')
          .replace(/\s{2,}/g, ' ')
          .trim();
      } else {
        // Select: append to the end, without overwriting manual edits
        button.classList.add('active');
        const current = reviewTextarea.value.trim();
        reviewTextarea.value = current ? current + ' ' + text : text;
      }
    });
  });

  function copyAndRedirect() {
    const textToCopy = reviewTextarea.value.trim();

    // Replace with your store's actual Google Place ID
    const googleReviewUrl = "https://search.google.com/local/writereview?placeid=ChIJk8udlzCLGGARswE-mkVYg1M";

    if (!textToCopy) {
      alert("Please select an option or write a comment first.");
      return;
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(textToCopy).then(() => {
        alert("Copied! Paste it into the review box on the next screen and tap Post.");
        window.location.href = googleReviewUrl;
      }).catch(() => {
        window.location.href = googleReviewUrl;
      });
    } else {
      window.location.href = googleReviewUrl;
    }
  }
</script>

</body>
</html>
